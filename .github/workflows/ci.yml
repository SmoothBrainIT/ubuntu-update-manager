name: Shell checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check Bash syntax
        run: bash -n ubuntu-update-manager.sh tests/smoke.sh

      - name: Run ShellCheck and smoke tests
        run: |
          shellcheck ubuntu-update-manager.sh tests/smoke.sh
          bash tests/smoke.sh
